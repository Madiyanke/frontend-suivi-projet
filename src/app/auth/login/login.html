<div class="min-h-screen flex items-center justify-center bg-slate-50 relative overflow-hidden">
      <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0">
        <div class="absolute -top-24 -right-24 w-96 h-96 rounded-full bg-indigo-100 blur-3xl opacity-50"></div>
        <div class="absolute top-1/2 -left-24 w-72 h-72 rounded-full bg-blue-100 blur-3xl opacity-50"></div>
      </div>
      <div class="relative z-10 w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-8 md:p-10 animate-fade-in-up">
        <div class="text-center mb-8">
          <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-600 text-white text-2xl font-bold mb-4 shadow-lg shadow-indigo-200">S</div>
          <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Bienvenue sur SuiviProjet</h1>
          <p class="text-slate-500 mt-2 text-sm">Entrez vos identifiants pour accéder à l'espace universitaire.</p>
        </div>
        <form (submit)="onSubmit()" class="space-y-5">
          <div class="space-y-1.5">
            <label class="text-xs font-bold text-slate-700 uppercase tracking-wide">Email Académique</label>
            <div class="relative">
              <input type="email" name="email" [(ngModel)]="credentials.email" required
                class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder-slate-400"
                placeholder="ex: admin@univ-pau.fr">
            </div>
          </div>
          <div class="space-y-1.5">
            <label class="text-xs font-bold text-slate-700 uppercase tracking-wide">Mot de passe</label>
            <div class="relative">
              <input type="password" name="mdp" [(ngModel)]="credentials.mdp" required
                class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder-slate-400"
                placeholder="••••••••">
            </div>
          </div>
          @if (errorMessage()) {
            <div class="p-3 rounded-lg bg-red-50 border border-red-100 text-red-600 text-sm flex items-center gap-2 animate-shake">
              <span>⚠️</span> {{ errorMessage() }}
            </div>
          }
          <button type="submit" [disabled]="isLoading()"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-lg shadow-lg shadow-indigo-200 transition-all transform active:scale-[0.98] disabled:opacity-70 disabled:cursor-not-allowed flex justify-center items-center gap-2 mt-2">
            @if (isLoading()) {
              <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span>Connexion...</span>
            } @else {
              <span>Se connecter</span>
            }
          </button>
        </form>
      </div>
    </div>
